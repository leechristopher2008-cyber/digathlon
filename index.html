<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digathlon · draft v2</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* RASCUNHO v2: a toupeira cava para o fundo e a câmera vai junto */
  :root {
    color-scheme: dark;
    --soil:#1a120c; --panel:#241912; --panel2:#2f2118; --well:#120c08; --line:#4a3424;
    --amber:#f2a93b; --lava:#ff5a36; --gold:#ffd257; --moss:#86c24f; --cream:#f5e9d6; --muted:#a8927a;
    --display:"Silkscreen", "Courier New", monospace; --ui:"Pixelify Sans", "Courier New", monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b0814; color:var(--cream); font-family:var(--ui); }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:50; background:repeating-linear-gradient(#0000 0 2px, #0000001a 2px 3px); }
  canvas#cv { position:fixed; inset:0; display:block; image-rendering:pixelated; }
  button, input { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .hide { display:none !important; }

  .btn { font-family:var(--display); letter-spacing:2px; background:var(--panel2); border:3px solid var(--amber); color:var(--cream);
    padding:12px 18px; cursor:pointer; box-shadow:0 0 12px #f2a93b33, 3px 3px 0 #000a; }
  .btn:hover { background:#3a2a1e; }
  .btn.lava { border-color:var(--lava); background:#3a1810; box-shadow:0 0 14px #ff5a3655, 3px 3px 0 #000a; }
  .btn.ghost { border-color:var(--line); box-shadow:3px 3px 0 #000a; }
  .panel { background:#241912f0; border:2px solid var(--line); box-shadow:inset 0 0 0 2px #00000055, 4px 4px 0 #0008; padding:20px; }

  /* tela de título */
  #title { position:fixed; left:0; right:0; top:9vh; text-align:center; padding:0 16px; pointer-events:none; }
  .logo { font-family:var(--display); font-weight:700; font-size:clamp(34px, 9vw, 76px); letter-spacing:4px; margin:0; line-height:1; color:var(--cream);
    text-shadow:0 4px 0 #8a5a2b, 0 8px 0 #5b3a1f, 0 12px 0 #2e1d10, 0 0 30px #f2a93b55; }
  .sub { font-family:var(--display); letter-spacing:3px; color:var(--amber); font-size:clamp(11px, 2.4vw, 15px); margin-top:22px; }
  #titleBtns { position:fixed; left:50%; transform:translateX(-50%); bottom:max(20px, 4vh); display:flex; flex-direction:column; gap:12px; width:min(340px, calc(100vw - 32px)); }
  .blink { animation:blink 1.1s steps(2, start) infinite; }
  @keyframes blink { 50% { color:#ff5a36; } }

  /* HUD */
  #hud { position:fixed; top:10px; left:0; right:0; display:flex; justify-content:center; align-items:flex-start; gap:clamp(10px, 4vw, 60px); padding:0 16px; z-index:5; }
  .hp { background:#120c08cc; border:2px solid var(--line); padding:6px 14px 4px; min-width:110px; }
  .hp small, .prog small { display:block; font-family:var(--display); font-size:10px; letter-spacing:2px; color:var(--muted); }
  .hp b { font-family:var(--display); font-size:22px; color:var(--amber); letter-spacing:1px; white-space:nowrap; }
  .hp.r { text-align:right; } .hp.r b { color:var(--lava); }
  .prog { text-align:center; padding-top:6px; }
  #squares { display:flex; gap:5px; justify-content:center; margin-bottom:4px; }
  .sq { width:14px; height:14px; background:#2a1d14; border:2px solid var(--line); }
  .sq.now { border-color:var(--amber); box-shadow:0 0 8px #f2a93b88; }
  .sq.miss { background:#120c08; border-color:#3a2a20; }
  #banner { position:fixed; top:78px; left:16px; z-index:5; font-family:var(--display); letter-spacing:3px; font-size:13px; color:var(--gold);
    text-shadow:0 0 10px #ffd25766; opacity:0; transition:opacity .6s; pointer-events:none; }
  #banner.show { opacity:1; }

  /* pergunta flutuando */
  #qp { position:fixed; top:84px; left:50%; transform:translateX(-50%); width:min(600px, calc(100vw - 32px)); z-index:4;
    background:#1a120ccc; border:2px solid var(--line); box-shadow:4px 4px 0 #0008; padding:16px 20px 12px; backdrop-filter:blur(2px); }
  .ql { font-family:var(--display); font-size:11px; letter-spacing:3px; color:var(--lava); }
  .qt { font-family:var(--display); font-size:clamp(17px, 3.4vw, 25px); line-height:1.35; margin:8px 0 10px; text-wrap:balance; }
  .qh { font-family:var(--display); font-size:10px; letter-spacing:2px; color:var(--muted); }

  /* barra de resposta */
  #cdown { position:fixed; left:0; right:0; bottom:max(34px, env(safe-area-inset-bottom)); text-align:center; z-index:4;
    font-family:var(--display); font-size:13px; letter-spacing:3px; color:var(--muted); }
  #cdown b { color:var(--amber); font-size:18px; }
  #bar { position:fixed; left:50%; transform:translateX(-50%); bottom:max(18px, env(safe-area-inset-bottom)); width:min(640px, calc(100vw - 32px)); z-index:4;
    display:grid; grid-template-columns:56px 1fr auto; gap:6px 10px; align-items:center; }
  .ring { position:relative; width:56px; height:56px; }
  .ring svg { width:56px; height:56px; transform:rotate(-90deg); }
  .ring circle { fill:#120c08dd; stroke-width:4; }
  .ring .rb { stroke:#3a2a20; } .ring .rf { fill:none; stroke:var(--amber); stroke-dasharray:150.8; transition:stroke .3s; }
  .ring span { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:17px; color:var(--amber); }
  #ans { min-width:0; height:52px; background:#120c08e6; border:2px solid var(--amber); padding:0 14px; font-family:var(--ui); font-size:20px; }
  #ans:focus { outline:none; box-shadow:0 0 12px #f2a93b55; }
  #bDig { height:52px; padding:0 16px; }
  .tline { grid-column:1 / -1; height:4px; background:#2a1d14; }
  .tline i { display:block; height:100%; width:100%; background:var(--amber); }
  #msg { grid-column:1 / -1; min-height:1.2em; text-align:center; font-family:var(--display); font-size:11px; letter-spacing:2px; color:var(--lava); }
  .shake { animation:shake .35s; }
  @keyframes shake { 20%{ margin-left:-8px } 40%{ margin-left:8px } 60%{ margin-left:-5px } 80%{ margin-left:5px } }

  /* cartão de resultado */
  #card { position:fixed; top:calc(36vh + 24px); left:50%; transform:translateX(-50%); width:min(420px, calc(100vw - 32px)); text-align:center; z-index:6;
    max-height:calc(64vh - 36px); overflow:auto; padding:14px 20px; }
  #gem { width:72px; height:60px; image-rendering:pixelated; }
  #cTier { font-family:var(--display); font-weight:700; font-size:32px; letter-spacing:4px; margin:6px 0 4px; }
  #cAns { font-size:20px; }
  #cPts { font-family:var(--display); font-size:15px; margin:8px 0; color:var(--cream); }
  #cSay { color:var(--muted); font-size:15px; margin-bottom:16px; }
  .rainbow { background:linear-gradient(90deg,#ff4d6d,#ffb020,#ffd257,#86c24f,#4c8dff,#a35cff,#ff4d6d); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent !important; animation:rb 2s linear infinite; }
  @keyframes rb { to { background-position:200% 0; } }

  /* fim */
  #end { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(460px, calc(100vw - 32px)); z-index:6; max-height:calc(100vh - 40px); overflow:auto; }
  .big { font-family:var(--display); font-size:46px; color:var(--amber); margin:6px 0 0; }
  #eLayer { color:var(--muted); margin-bottom:12px; }
  #eLog { list-style:none; padding:0; margin:0 0 16px; display:grid; gap:6px; }
  #eLog li { display:flex; justify-content:space-between; gap:10px; border-bottom:2px dashed var(--line); padding-bottom:5px; font-size:16px; }
  #eLog li b { font-family:var(--display); font-size:12px; letter-spacing:1px; white-space:nowrap; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  #bBack { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:6; }
  /* parte B: tamanho/fonte/contraste vindos das configurações */
  body { --fs:18px; --qf:var(--display); --af:var(--ui); }
  .qt { font-size:calc(var(--fs) * 1.3); font-family:var(--qf); }
  #ans { font-size:calc(var(--fs) * 1.1); font-family:var(--af); }
  #cSay, #cAns, #eLog li span, .qn { font-size:var(--fs); }
  .qn { color:var(--muted); font-size:calc(var(--fs) * .75) !important; margin-top:6px; }
  .tools { position:fixed; top:max(12px, env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); z-index:7; display:flex; gap:8px; align-items:center; }
  .tools select, .tools button { background:#120c08dd; border:2px solid var(--line); padding:6px 10px; font-family:var(--ui); font-size:15px; cursor:pointer; }
  #cfg { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(480px, calc(100vw - 32px)); max-height:calc(100vh - 40px); overflow:auto; z-index:20; display:grid; gap:12px; font-size:var(--fs); }
  #cfg h2 { font-family:var(--display); letter-spacing:3px; font-size:16px; color:var(--amber); margin:0; }
  #cfg label { display:grid; gap:4px; } #cfg .check { display:flex; gap:10px; align-items:center; }
  #cfg input[type=range] { width:100%; accent-color:var(--amber); }
  #cfg select { background:var(--well); border:2px solid var(--line); padding:8px; }
  #cfg .help { color:var(--muted); font-size:.8em; margin:0; }
  #bSurface { border-color:var(--line); margin-top:8px; }
  body.contraste { --line:#ffe600; --amber:#ffe600; --muted:#ffffff; --cream:#ffffff; --lava:#ffe600; }
  body.contraste #qp, body.contraste .hp, body.contraste .panel, body.contraste #ans, body.contraste .ring circle { background:#000 !important; fill:#000; }
  body.contraste .qt, body.contraste #ans, body.contraste #cAns, body.contraste #cSay { color:#fff; }
  body.contraste #cdown { color:#fff; background:#000; padding:6px 0; }
  /* parte C: festa da naja */
  #pSetup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(500px, calc(100vw - 32px)); max-height:calc(100vh - 40px); overflow:auto; z-index:8; display:grid; gap:12px; font-size:var(--fs); }
  #pSetup h2 { font-family:var(--display); letter-spacing:3px; font-size:18px; color:var(--amber); margin:0; }
  #pSetup p { margin:0; line-height:1.4; }
  #pSetup .help { color:var(--muted); font-size:.8em; }
  #pNames, #pIn { min-width:0; width:100%; height:52px; background:#120c08e6; border:2px solid var(--amber); padding:0 14px; font-family:var(--af); font-size:calc(var(--fs) * 1.1); }
  #pNames:focus, #pIn:focus { outline:none; box-shadow:0 0 12px #f2a93b55; }
  .pmsg, #pMsg { min-height:1.2em; font-family:var(--display); font-size:11px; letter-spacing:2px; color:var(--lava); text-align:center; }
  #pMsg.ok { color:var(--moss); }
  #den { position:fixed; z-index:3; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle, #0c080ecc 0 52%, #0c080e66 64%, #0c080e00 71%); }
  #den::before { content:""; position:absolute; inset:9%; border:2px dashed #f2a93b55; border-radius:50%; }
  #najaC { width:30%; image-rendering:pixelated; transform-origin:50% 90%; transition:translate .16s ease-out; }
  #najaC.shk { animation:cshake var(--spd, 1s) steps(2) infinite; }
  @keyframes cshake { 50% { rotate:-7deg; } }
  .seat { position:absolute; transform:translate(-50%,-50%); width:96px; text-align:center; font-family:var(--af); font-size:calc(var(--fs) * .8); color:var(--cream); text-shadow:0 2px 0 #000; overflow-wrap:anywhere; }
  .seat .av { width:46px; height:46px; margin:0 auto 4px; background:var(--panel2); border:3px solid var(--line); display:grid; place-items:center; font-family:var(--display); font-size:20px; box-shadow:3px 3px 0 #000a; }
  .seat.on { color:var(--gold); }
  .seat.on .av { border-color:var(--gold); box-shadow:0 0 16px #ffd25799, 3px 3px 0 #000a; }
  .seat.next .av { border-color:var(--amber); border-style:dashed; }
  .seat .bt { color:var(--lava); font-family:var(--display); font-size:10px; letter-spacing:1px; min-height:12px; }
  .seat.bit .av { background:#5a1810; border-color:var(--lava); animation:shake .35s 2; }
  #pbar { position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); width:min(640px, calc(100vw - 32px)); z-index:4; display:grid; gap:6px; }
  #pTurn { text-align:center; font-size:var(--fs); text-shadow:0 2px 0 #000; } #pTurn b { color:var(--gold); }
  .prow { display:grid; grid-template-columns:1fr auto; gap:10px; } #bPass { height:52px; padding:0 16px; }
  #pChips { display:flex; gap:6px; justify-content:center; overflow:hidden; height:30px; }
  .pchip { flex:none; border:2px solid; padding:2px 8px; font-size:calc(var(--fs) * .75); background:#120c08cc; white-space:nowrap; }
  #pEnd { position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); width:min(560px, calc(100vw - 32px)); z-index:6; text-align:center; display:grid; gap:12px; }
  #pBoom { font-family:var(--display); font-size:clamp(18px, 4vw, 26px); letter-spacing:2px; color:var(--lava); }
  #pEnd .row { justify-content:center; }
  #flash { position:fixed; inset:0; z-index:9; pointer-events:none; background:#ff3b1f; opacity:0; }
  #flash.go { animation:flash .7s ease-out; } @keyframes flash { 0% { opacity:.55; } 100% { opacity:0; } }
  body.party .qh { display:none; }
  body.contraste #den { background:#000; } body.contraste .seat .av, body.contraste .pchip, body.contraste #pNames, body.contraste #pIn { background:#000; color:#fff; }
  body.contraste #pTurn, body.contraste #pMsg { background:#000; }
  @media (max-height:720px) { #titleBtns { gap:8px; bottom:12px; } #titleBtns .btn { padding:8px 18px; } }
  @media (prefers-reduced-motion:reduce) { #najaC.shk, #flash.go, .seat.bit .av { animation:none; } }
  .draft { position:fixed; left:10px; bottom:6px; z-index:3; font-family:var(--display); font-size:9px; letter-spacing:1px; color:#a8927a99; pointer-events:none; }
  @media (max-width:560px) {
    .hp { min-width:0; padding:4px 8px 2px; } .hp b { font-size:17px; }
    #qp { top:74px; } #banner { top:66px; } .sq { width:11px; height:11px; }
    #bar { grid-template-columns:48px 1fr auto; } .ring, .ring svg { width:48px; height:48px; } #bDig { padding:0 10px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="hp"><small><span data-t="depth">DEPTH</span> · <span id="hLayer">TOPSOIL</span></small><b id="hDepth">0 m</b></div>
  <div class="prog"><div id="squares"></div><small id="hDig">DIG 1 OF 5</small></div>
  <div class="hp r"><small data-t="score">SCORE</small><b id="hScore">0</b></div>
</div>
<div id="banner"></div>

<div id="title">
  <h1 class="logo">DIGATHLON</h1>
  <div class="sub" data-t="tagline">the weirder the answer, the deeper you dig</div>
</div>
<div id="titleBtns">
  <button id="bStart" class="btn lava blink" data-t="daily">▼ DAILY DIG ▼</button>
  <button id="bFree" class="btn" data-t="free">FREE DIG ∞</button>
  <button id="bParty" class="btn" data-t="partyBtn">≈ COBRA PARTY ≈</button>
  <button id="bTour" class="btn ghost" data-t="tour">TOUR THE LAYERS</button>
</div>
<div class="tools" id="tools">
  <select id="cLang" aria-label="Language / Idioma"><option value="en">🌐 English</option><option value="pt">🌐 Português</option></select>
  <button id="bCfg" type="button" aria-label="Settings">⚙️</button>
</div>
<div id="cfg" class="panel hide" role="dialog" aria-labelledby="cfgT">
  <h2 id="cfgT" data-t="settings">SETTINGS</h2>
  <div class="check"><input type="checkbox" id="cAcess"><label for="cAcess" data-t="accessible">Accessible mode</label></div>
  <p class="help" data-t="accessibleHelp"></p>
  <label><span><span data-t="fontSize">Text size</span>: <b id="vFs"></b></span><input type="range" id="cFs" min="14" max="36" step="1"></label>
  <label><span data-t="font">Font</span>
    <select id="cFf"><option value="pixel">Pixel (Digathlon)</option><option value="system-ui, sans-serif">System</option><option value="Verdana, sans-serif">Verdana</option><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option></select></label>
  <label><span><span data-t="time">Time to answer</span>: <b id="vTempo"></b></span><input type="range" id="cTempo" min="10" max="90" step="5"></label>
  <div class="check"><input type="checkbox" id="cContr"><label for="cContr" data-t="contrast">High contrast</label></div>
  <p class="help" data-t="saved"></p>
  <div class="row"><button class="btn ghost" id="cReset" type="button" data-t="reset">RESET</button><button class="btn lava" id="cClose" type="button" data-t="close">OK</button></div>
</div>

<div id="qp" class="hide">
  <div class="ql" id="qLabel">DIG 1 OF 5</div>
  <div class="qt" id="qText"></div>
  <div class="qh" data-t="hint">▼ weirder answers dig deeper ▼</div>
  <div class="qn" id="qNote" hidden></div>
</div>
<div id="cdown" class="hide"></div>
<form id="bar" class="hide" autocomplete="off">
  <div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" class="rb"/><circle cx="28" cy="28" r="24" id="ringFg" class="rf"/></svg><span id="ringN">25</span></div>
  <input id="ans" type="text" placeholder="type one answer…" maxlength="40" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer">
  <button class="btn lava" id="bDig" type="submit" data-t="dig">DIG ▼</button>
  <div class="tline"><i id="tFill"></i></div>
  <div id="msg" aria-live="polite"></div>
</form>

<div id="card" class="panel hide" role="dialog" aria-live="polite">
  <canvas id="gem" width="36" height="30"></canvas>
  <div id="cTier"></div>
  <div id="cAns"></div>
  <div id="cPts"></div>
  <div id="cSay"></div>
  <div class="row" style="justify-content:center"><button id="bNext" class="btn">▼ KEEP DIGGING</button>
  <button id="bSurface" class="btn hide" data-t="surface">▲ SURFACE</button></div>
</div>

<div id="end" class="panel hide">
  <div class="ql" data-t="complete">DIG COMPLETE</div>
  <div class="big" id="eScore"></div>
  <div id="eLayer"></div>
  <ol id="eLog"></ol>
  <div class="row">
    <button id="bAgain" class="btn lava" data-t="again">↻ DIG AGAIN</button>
    <button id="bTour2" class="btn ghost" data-t="tour">TOUR THE LAYERS</button>
  </div>
</div>
<button id="bBack" class="btn hide" data-t="back">▲ BACK TO THE SURFACE</button>

<!-- parte C: festa da naja (um aparelho só) -->
<form id="pSetup" class="panel hide" role="dialog" aria-labelledby="pSetupT" autocomplete="off">
  <h2 id="pSetupT" data-t="party">COBRA PARTY</h2>
  <p data-t="partyDesc"></p>
  <label for="pNames" class="help" data-t="namesHelp"></label>
  <input id="pNames" type="text" maxlength="160" spellcheck="false" autocapitalize="words">
  <div id="pSetupMsg" class="pmsg" aria-live="polite"></div>
  <div class="row"><button class="btn ghost" id="pCancel" type="button" data-t="back2">◀ BACK</button><button class="btn lava" type="submit" data-t="start">START ▼</button></div>
</form>
<div id="den" class="hide" aria-hidden="true"><canvas id="najaC"></canvas></div>
<form id="pbar" class="hide" autocomplete="off">
  <div id="pTurn" aria-live="polite"></div>
  <div class="prow"><input id="pIn" type="text" maxlength="40" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Answer"><button class="btn lava" id="bPass" type="submit" data-t="pass">PASS ▶</button></div>
  <div id="pMsg" aria-live="polite"></div>
  <div id="pChips"></div>
</form>
<div id="pEnd" class="panel hide" role="dialog" aria-live="assertive">
  <div id="pBoom"></div>
  <div class="row"><button id="pAgain" class="btn lava" data-t="newRound">↻ NEW ROUND</button><button id="pReset" class="btn ghost" data-t="changePlayers">CHANGE PLAYERS</button><button id="pUp" class="btn ghost" data-t="surface">▲ SURFACE</button></div>
</div>
<div id="flash"></div>
<div class="draft">v2</div>

<script>
/* ================= IDIOMA (EN padrão / PT) ================= */
const STR = {
  en: { tagline:"the weirder the answer, the deeper you dig", daily:"▼ DAILY DIG ▼", free:"FREE DIG ∞", tour:"TOUR THE LAYERS",
    depth:"DEPTH", score:"SCORE", hint:"▼ weirder answers dig deeper ▼", dig:"DIG ▼", ph:"type one answer…",
    count:"digging in · the clock starts in <b>{n}</b>", timesUp:"TIME'S UP · <b>NEXT PROMPT</b>", wrong:"not in the burrow · try another",
    of:"DIG {a} OF {b}", freeLbl:"FREE DIG · #{n}", tourLbl:"LAYER TOUR", keep:"▼ KEEP DIGGING", see:"▼ SEE YOUR DIG", surface:"▲ SURFACE",

  for (let j = 1; j <= b.length; j++) { const t = m[j]; m[j] = Math.min(m[j] + 1, m[j-1] + 1, prev + (a[i-1] === b[j-1] ? 0 : 1)); prev = t; } } return m[b.length]; }

    const dx = ix / rX, dy = iy / rY; if (dx*dx + dy*dy > 1) continue; g.fillStyle = fn(dx, dy); g.fillRect(ox + ix*PX, oy + iy*PX, PX, PX); } };

  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  update(dt); draw(); requestAnimationFrame(frame);
}
function update(dt){
  digging = false;
  if (tw) { tw.t += dt; const p = Math.min(1, tw.t / tw.dur), e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;   // acelera e freia suave
    moleD = tw.from + (tw.to - tw.from)*e; digging = true;
    if (p >= 1) { const d = tw.done; tw = null; digging = false; d && d(); } }
  if (mode === "tour") { tourT += dt; if (moleD < TOUR_END) { moleD = Math.min(TOUR_END, moleD + Math.min(1300, 220 + tourT*160)*dt); digging = true; } }
  if (digging && Math.random() < .9) crumbs(2);
  // molas: gira de cabeça pra baixo ao cavar, balança, achata ao chegar e dá um pulinho
  if (digging && !wasDigging) sqV += 3; if (!digging && wasDigging) sqV -= 4; wasDigging = digging;
  const tA = digging ? Math.PI/2 + Math.sin(clock*15)*.09 : 0;
  angV += (tA - ang)*90*dt; angV *= Math.exp(-dt*11); ang += angV*dt;
  sqV += -sq*260*dt; sqV *= Math.exp(-dt*9); sq = clamp(sq + sqV*dt, -.22, .22);
  if (hopV !== 0 || hopY < 0) { hopV += 1500*dt; hopY += hopV*dt; if (hopY > 0) { hopY = 0; hopV = 0; sqV -= 2.5; } }
  if (mode === "count") { cd -= dt; $("cdown").innerHTML = tr("count", { n:Math.max(1, Math.ceil(cd)) }); if (cd <= 0) ask(); }
  if (mode === "ask") { timeLeft -= dt; const f = Math.max(0, timeLeft / CFG.tempo);
    $("ringN").textContent = Math.max(0, Math.ceil(timeLeft)); $("ringFg").style.strokeDashoffset = 150.8*(1 - f);
    $("ringFg").style.stroke = timeLeft < 6 ? "#ff5a36" : "#f2a93b"; $("tFill").style.width = (f*100) + "%"; $("tFill").style.background = timeLeft < 6 ? "#ff5a36" : "#f2a93b";
    if (timeLeft <= 0) timeout(); }
  if (mode === "party") { layoutDen();
    if (PT.ativo) { PT.t += dt; const spd = Math.max(.12, 1.1 - PT.t / PT.dur).toFixed(2) + "s";   // balança mais rápido perto do bote
      if (spd !== lastSpd) { lastSpd = spd; $("najaC").style.setProperty("--spd", spd); }
      if (PT.t >= PT.dur) bite(); } }
  if (lines) TIERS.forEach((T, k) => { if (!lines.lit[k] && moleD >= lines.from + T.m - .001) { lines.lit[k] = true; if (mode === "dig") burst(T.col, 8); } });
  // câmera: segue a toupeira com suavidade
  const target = mode === "title" ? titleCam() : camTarget();
  camD += (target - camD)*(1 - Math.exp(-dt*(mode === "dive" ? 3.5 : 7)));
  // camada nova -> faixa com o nome
  if (started && moleD >= 0) { const L = layerAt(moleD);
    if (L !== lastLayer) { lastLayer = L; $("banner").textContent = `— ${L10("layers")[L]} · ${fmtL(LAYERS[L].from)} m —`; $("banner").classList.add("show"); bannerT = 2.8; } }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $("banner").classList.remove("show"); }
  $("hDepth").textContent = `${fmtL(Math.max(0, Math.floor(moleD)))} m`; $("hLayer").textContent = L10("layers")[layerAt(Math.max(0, moleD))]; $("hScore").textContent = score;
  // partículas
  parts = parts.filter(p => (p.life -= dt) > 0); parts.forEach(p => { p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; });
  if (started && LAYERS[layerAt(moleD)].name === "MAGMA" && Math.random() < .25)
    parts.push({ x:Math.random()*W, y:(camD + SURF)*MPX + H + 10, vx:(Math.random() - .5)*20, vy:-(40 + Math.random()*60), g:0, life:4, col:Math.random() < .5 ? "#ffb020" : "#ff5a36" });
  motes.forEach(m => { m.y -= m.v*dt; m.x += Math.sin(clock + m.v)*dt*6; if (m.y < -4) { m.y = H + 4; m.x = Math.random()*W; } });
}

function draw(){
  const camY = Math.round((camD + SURF)*MPX);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#0b0814"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, -camY);
  // céu
  if (camY < 0) {
    const sg = ctx.createLinearGradient(0, -H*1.4, 0, 0); sg.addColorStop(0, "#0b0814"); sg.addColorStop(.65, "#1f1220"); sg.addColorStop(1, "#4a2a18");
    ctx.fillStyle = sg; ctx.fillRect(0, camY, W, -camY);
    stars.forEach(s => { ctx.globalAlpha = .45 + .55*Math.abs(Math.sin(clock*1.3 + s.ph)); ctx.fillStyle = "#f5e9d6"; ctx.fillRect(snap(s.x), snap(s.y), PX*s.s/1.5|0 || 2, PX*s.s/1.5|0 || 2); });
    ctx.globalAlpha = 1; blob(ctx, W*.8, -H*.62, 7, 7, ["#f5e9d6","#fffaf0","#d8c8b0"], false);
    blob(ctx, W*.8 + PX*3, -H*.62 - PX*2, 6, 6, ["#1c111e","#1c111e","#1c111e"], false);
    for (let x = 0; x < W; x += PX*2) { if (started && Math.abs(x - W/2) < SPX*12) continue; const hh = (h(x, 5)*3)|0;
      for (let k = 1; k <= hh; k++) { ctx.fillStyle = MOSS[(k + (x/PX|0)) % 3]; ctx.fillRect(x, -k*PX, PX, PX); } }
  }
  // terra
  for (let ci = Math.max(0, Math.floor(camY / CH)); ci*CH < camY + H; ci++) ctx.drawImage(chunk(ci), 0, ci*CH);
  // túnel (largo o bastante pra toupeira deitada de cabeça pra baixo)
  const mwy = moleWY(), half = SPX*12;
  if (started) {
    for (let wy = Math.max(0, Math.floor(camY / B)*B); wy < mwy - SPX*4; wy += B) {
      const L = LAYERS[layerIdx(wy / MPX - SURF, W/2)], cx = snap(tunnelXs(wy));
      ctx.fillStyle = L.tun; ctx.fillRect(cx - half, wy, half*2, B);
      ctx.fillStyle = L.rim; ctx.fillRect(cx - half - PX, wy, PX, B); ctx.fillRect(cx + half, wy, PX, B);
      if (h(wy / B | 0, 3) < .3) { ctx.fillStyle = L.pal[3]; ctx.fillRect(cx - half + snap(h(wy, 4)*half*2), wy, PX, PX); }
    }
    blob(ctx, W/2 - half - PX*7, PX, 6, 2.6, DIRT); blob(ctx, W/2 + half + PX*7, PX, 6, 2.6, DIRT);   // montinhos na boca do buraco
  } else blob(ctx, W/2 + SPX*11, PX, 7, 3, DIRT);   // montinho onde ela vai cavar
  ctx.restore();

  // escuridão: quanto mais fundo, mais escuro; a lanterna da toupeira ilumina em volta
  const gdM = Math.max(0, moleD), Lm = layerAt(gdM), C = moleCenter();
  let a = clamp((gdM - 250) / 2200, 0, .86); if (LAYERS[Lm].name === "MAGMA") a *= .62;
  if (a > 0) { const rg = ctx.createRadialGradient(C.x, C.y - camY, SPX*8, C.x, C.y - camY, Math.min(W, H)*.55);
    rg.addColorStop(0, "rgba(6,4,3,0)"); rg.addColorStop(1, `rgba(6,4,3,${a})`); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); }
  if (LAYERS[Lm].name === "MAGMA") { ctx.fillStyle = "rgba(255,90,40,.07)"; ctx.fillRect(0, 0, W, H); }
  if (started) { ctx.fillStyle = "#f5e9d6"; motes.forEach(m => { ctx.globalAlpha = .1; ctx.fillRect(snap(m.x), snap(m.y), PX/2 + 1, PX/2 + 1); }); ctx.globalAlpha = 1; }

  ctx.save(); ctx.translate(0, -camY);
  const narrow = W < 700, rulerX = W - (narrow ? 14 : 30);
  // curiosidades nas laterais
  ctx.font = `${narrow ? 10 : 12}px Silkscreen, monospace`; ctx.textBaseline = "middle";
  FACTS.forEach(([d], i) => { const txt = L10("facts")[i]; const y = wyOf(d); if (y < camY - 40 || y > camY + H + 40) return;
    const lines2 = wrap(txt, narrow ? W*.3 : W*.24), left = i % 2 === 0; ctx.fillStyle = "rgba(200,180,155,.7)";
    lines2.forEach((t, j) => { const ty = y + (j - (lines2.length - 1)/2)*(narrow ? 13 : 16);
      ctx.textAlign = left ? "left" : "right"; const tx = left ? (narrow ? 10 : 28) : rulerX - (narrow ? 12 : 64);
      ctx.strokeStyle = "rgba(12,8,5,.85)"; ctx.lineWidth = 3; ctx.strokeText(t, tx, ty); ctx.fillText(t, tx, ty); });
    ctx.strokeStyle = "rgba(200,180,155,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); if (left) { ctx.moveTo(narrow ? 2 : 6, y); ctx.lineTo(narrow ? 8 : 20, y); } else { ctx.moveTo(rulerX - (narrow ? 8 : 56), y); ctx.lineTo(rulerX - 6, y); } ctx.stroke(); });
  // veios de raridade (linhas que a resposta atravessa)
  if (lines) TIERS.forEach((T, k) => { const y = wyOf(lines.from + T.m) - SPX*3, x0 = narrow ? 8 : W*.2, x1 = narrow ? rulerX - 10 : W*.78;
    let st = T.col; if (T.col === "rainbow") { st = ctx.createLinearGradient(x0, 0, x1, 0); ["#ff4d6d","#ffb020","#ffd257","#86c24f","#4c8dff","#a35cff"].forEach((c, i) => st.addColorStop(i/5, c)); }
    ctx.globalAlpha = lines.lit[k] ? 1 : .45; ctx.strokeStyle = st; ctx.lineWidth = lines.lit[k] ? PX*.75 : 2; ctx.setLineDash([PX*2, PX*2]);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = T.col === "rainbow" ? `hsl(${clock*120 % 360} 90% 65%)` : T.col; ctx.font = `${narrow ? 10 : 12}px Silkscreen, monospace`; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText(`${L10("tiers")[k]} · +${T.pts}`, x1, y - 4); ctx.globalAlpha = 1; });
  // toupeira: gira, balança e achata com molas (movimento macio)
  if (!moleGone) {   // na festa da naja a toupeira se esconde
  const spr = digging ? (Math.floor(clock*12) % 2 ? SP.dig : SP.idle) : ((clock % 3.4) < .13 ? SP.blink : SP.idle);
  ctx.save(); ctx.translate(C.x, C.y); ctx.rotate(ang); ctx.scale(1 + sq, 1 - sq);
  ctx.drawImage(spr, -MW*SPX/2, -MH*SPX/2); ctx.restore();
  // brilho da lanterna do capacete (gira junto com a cabeça)
  const ca = Math.cos(ang), sa = Math.sin(ang), ox = (LAMPXY[0] - MW/2)*SPX, oy = (LAMPXY[1] - MH/2)*SPX;
  const lx = C.x + ox*ca - oy*sa, ly = C.y + ox*sa + oy*ca;

  ctx.globalCompositeOperation = "source-over"; }

    let cx = C.x + SPX*13; if (cx + tw2 > rulerX - 8) cx = C.x - SPX*13 - tw2; if (cx < 4) cx = 4; const cy = C.y;
    ctx.fillStyle = "rgba(26,18,12,.92)"; ctx.fillRect(cx, cy - 16, tw2, 32);
    ctx.strokeStyle = chip.col ? (chip.col === "rainbow" ? `hsl(${clock*120 % 360} 90% 65%)` : chip.col) : "#f2a93b"; ctx.lineWidth = 2; ctx.strokeRect(cx + 1, cy - 15, tw2 - 2, 30);
    ctx.fillStyle = ctx.strokeStyle; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(chip.text, cx + 11, cy + 1); }
  // partículas
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.life*2); ctx.fillStyle = p.col; ctx.fillRect(snap(p.x), snap(p.y), PX, PX); }); ctx.globalAlpha = 1;
  // régua de profundidade + "YOU"
  if (started) { ctx.strokeStyle = "rgba(200,180,155,.45)"; ctx.fillStyle = "rgba(200,180,155,.6)"; ctx.lineWidth = 1; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = "10px Silkscreen, monospace";
    ctx.beginPath(); ctx.moveTo(rulerX + .5, Math.max(wyOf(0), camY)); ctx.lineTo(rulerX + .5, camY + H); ctx.stroke();
    for (let d = Math.max(0, Math.floor((camY / MPX - SURF) / 50)*50); wyOf(d) < camY + H; d += 50) { const y = Math.round(wyOf(d)) + .5, big = d % 250 === 0;
      ctx.beginPath(); ctx.moveTo(rulerX - (big ? 9 : 4), y); ctx.lineTo(rulerX, y); ctx.stroke(); if (big && !narrow) ctx.fillText(`${fmtL(d)} m`, rulerX - 12, y); }
    const yy = Math.round(wyOf(Math.max(0, moleD))); ctx.fillStyle = "#f2a93b";
    ctx.beginPath(); ctx.moveTo(rulerX + 2, yy); ctx.lineTo(rulerX + 10, yy - 5); ctx.lineTo(rulerX + 10, yy + 5); ctx.fill();
    if (!narrow) { ctx.textAlign = "right"; ctx.fillText(tr("you"), rulerX - 12, yy - 12); } }
  ctx.restore();
}
function wrap(txt, max){ const out = []; let cur = ""; txt.split(" ").forEach(w => { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > max && cur) { out.push(cur); cur = w; } else cur = t; }); out.push(cur); return out; }

/* ================= CONFIGURAÇÕES + TRADUÇÃO ================= */
function traduz(){
  document.documentElement.lang = CFG.lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = tr(el.dataset.t));
  $("pNames").placeholder = tr("namesPh"); $("pIn").placeholder = tr("passPh");
  $("ans").placeholder = tr("ph"); $("vTempo").textContent = CFG.tempo + " " + tr("seconds");
  if (curQ && !$("qp").classList.contains("hide")) labelQ();
  if (mode === "card" && log.length && log[log.length - 1]) { const l = log[log.length - 1];
    $("cTier").textContent = L10("tiers")[l.tier]; $("cSay").textContent = L10("says")[l.tier];
    $("bNext").textContent = !free && qi === QS.length - 1 ? tr("see") : tr("keep"); }
  if (mode === "end") endGame();
  if (mode === "tour") $("hDig").textContent = tr("tourLbl");
}
function aplicaCfg(){
  const b = document.body; b.style.setProperty("--fs", CFG.fs + "px");
  b.style.setProperty("--qf", CFG.ff === "pixel" ? "var(--display)" : CFG.ff); b.style.setProperty("--af", CFG.ff === "pixel" ? "var(--ui)" : CFG.ff);
  b.classList.toggle("contraste", CFG.contr);
  $("cAcess").checked = CFG.acess; $("cFs").value = CFG.fs; $("vFs").textContent = CFG.fs + " px"; $("cFf").value = CFG.ff;
  $("cTempo").value = CFG.tempo; $("vTempo").textContent = CFG.tempo + " " + tr("seconds"); $("cContr").checked = CFG.contr; $("cLang").value = CFG.lang;
  try { localStorage.setItem("digCfg2", JSON.stringify(CFG)); } catch (e) {}
}
$("cAcess").onchange = e => { CFG = { ...CFG, ...(e.target.checked ? ACESSIVEL : PADRAO) }; aplicaCfg(); };
$("cFs").oninput = e => { CFG.fs = +e.target.value; aplicaCfg(); };
$("cFf").onchange = e => { CFG.ff = e.target.value; aplicaCfg(); };
$("cTempo").oninput = e => { CFG.tempo = +e.target.value; aplicaCfg(); };
$("cContr").onchange = e => { CFG.contr = e.target.checked; aplicaCfg(); };
$("cReset").onclick = () => { CFG = { ...CFG, ...PADRAO }; aplicaCfg(); };
$("cLang").onchange = e => { CFG.lang = e.target.value; aplicaCfg(); traduz(); };
$("bCfg").onclick = () => show("cfg", $("cfg").classList.contains("hide"));
$("cClose").onclick = () => show("cfg", false);
aplicaCfg(); traduz();

addEventListener("resize", resize);
resize(); camD = titleCam(); requestAnimationFrame(frame);
